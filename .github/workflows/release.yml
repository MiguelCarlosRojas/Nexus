name: NEXUS Release & Assets Packaging

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Empaquetar y Publicar Release Oficial
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Comprimir Assets y Proyecto Nexus Limpio
        run: |
          mkdir -p dist
          zip -r "dist/Nexus-Game-${{ github.ref_name }}.zip" game/ -x "*.git*" "*__pycache__*" "*errors.txt*" "*log.txt*" "*.save" "*persistent*"

      - name: Crear GitHub Release con Assets Adjuntos
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: "NEXUS: 宿命の瞳 - ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
